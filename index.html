<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - น้องอาร์ตี้</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: #0f172a; /* พื้นหลังสีเข้มสไตล์ล้ำๆ */
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e293b;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
            position: relative;
            border: 2px solid #334155;
        }

        /* ตกแต่งแถบสีด้านบนด้วยสีแดง-ดำ */
        .cover-photo {
            background: linear-gradient(135deg, #dc2626 0%, #000000 100%);
            height: 140px;
            position: relative;
        }

        .avatar-container {
            margin-top: -70px;
            position: relative;
            z-index: 5;
        }

        /* รูปโปรไฟล์วงกลม */
        .avatar-placeholder {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #1e293b;
            background: #000000;
            color: #dc2626;
            font-size: 54px;
            line-height: 120px;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        .profile-body {
            padding: 30px 24px;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .nickname {
            background: linear-gradient(90deg, #dc2626, #991b1b);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        /* ส่วนกล่องข้อความข้อมูลส่วนตัว */
        .info-box {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            border: 1px solid #334155;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: #1e293b;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ef4444; /* สีไอคอนสีแดงสว่าง */
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            border: 1px solid #334155;
        }

        .info-details {
            display: flex;
            flex-direction: column;
        }

        .info-title {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
        }

        .info-value {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ตกแต่งส่วนแสดงสีที่ชอบเป็นพิเศษ */
        .color-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-right: 5px;
            font-weight: 600;
        }
        .color-black { background: #000000; color: #fff; border: 1px solid #475569; }
        .color-red { background: #dc2626; color: #fff; }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
        
        .footer i {
            color: #dc2626;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="cover-photo"></div>

        <div class="avatar-container">
            <div class="avatar-placeholder">A</div>
        </div>

        <div class="profile-body">
            <h1 class="name">ด.ช. ธนกฤต ธนันชัย</h1>
            <div class="nickname"><i class="fa-solid fa-gamepad"></i> ชื่อเล่น: อาร์ตี้ (Arty)</div>

            <div class="info-box">
                
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-cake-candles"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-title">วันเกิด</span>
                        <span class="info-value">28 มีนาคม 2555</span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-laptop-code"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-title">วิชาที่ชอบ</span>
                        <span class="info-value">คอมพิวเตอร์</span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-title">อาหารที่ชอบ</span>
                        <span class="info-value">แซลม่อน  🍣</span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-title">สีที่ชอบ</span>
                        <span class="info-value" style="margin-top: 5px;">
                            <span class="color-badge color-black">สีดำ</span>
                            <span class="color-badge color-red">สีแดง</span>
                        </span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-user-group"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-title">เพื่อนสนิท</span>
                        <span class="info-value">ลลิตา </span>
                    </div>
                </div>

            </div>

            <div class="footer">
                <p>สร้างด้วยความใส่ใจ <i class="fa-solid fa-heart"></i> ยินดีที่ได้รู้จักครับ</p>
            </div>
        </div>
    </div>

</body>
</html>
